asyncapi: 3.0.0
info:
  title: FoC domain events
  version: 1.0.0
  description: Canonical v1 contracts for the foc.events RabbitMQ topic exchange.
defaultContentType: application/json
servers:
  local:
    host: rabbitmq:5672
    protocol: amqp
channels:
  userCreated:
    address: user.created
    messages:
      event:
        $ref: '#/components/messages/UserCreated'
  orderCreated:
    address: order.created
    messages:
      event:
        $ref: '#/components/messages/OrderEvent'
  orderAccepted:
    address: order.accepted
    messages:
      event:
        $ref: '#/components/messages/OrderEvent'
  orderPickedUp:
    address: order.picked_up
    messages:
      event:
        $ref: '#/components/messages/OrderEvent'
  orderCompleted:
    address: order.completed
    messages:
      event:
        $ref: '#/components/messages/OrderEvent'
  orderCancelled:
    address: order.cancelled
    messages:
      event:
        $ref: '#/components/messages/OrderEvent'
  orderExpired:
    address: order.expired
    messages:
      event:
        $ref: '#/components/messages/OrderEvent'
  creditReserved:
    address: credit.reserved
    messages:
      event:
        $ref: '#/components/messages/CreditEvent'
  creditReservationFailed:
    address: credit.reservation_failed
    messages:
      event:
        $ref: '#/components/messages/CreditEvent'
  creditTransferred:
    address: credit.transferred
    messages:
      event:
        $ref: '#/components/messages/CreditEvent'
  creditReleased:
    address: credit.released
    messages:
      event:
        $ref: '#/components/messages/CreditEvent'
components:
  messages:
    UserCreated:
      name: user.created
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              event_type:
                const: user.created
              payload:
                $ref: '#/components/schemas/UserIdentityPayload'
    OrderEvent:
      name: order.lifecycle
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              event_type:
                enum:
                  - order.created
                  - order.accepted
                  - order.picked_up
                  - order.completed
                  - order.cancelled
                  - order.expired
              payload:
                $ref: '#/components/schemas/OrderPayload'
    CreditEvent:
      name: credit.outcome
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              event_type:
                enum:
                  - credit.reserved
                  - credit.reservation_failed
                  - credit.transferred
                  - credit.released
              payload:
                $ref: '#/components/schemas/CreditPayload'
  schemas:
    Envelope:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - schema_version
        - occurred_at
        - correlation_id
        - payload
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        schema_version:
          const: 1
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
          format: uuid
        payload:
          type: object
    UserIdentityPayload:
      type: object
      required: [user_id, nus_student_number]
      properties:
        user_id:
          type: string
          format: uuid
        nus_student_number:
          type: string
          pattern: '^[AU][0-9]{7}[A-Z]$'
    OrderPayload:
      type: object
      required: [order_id, requester_id, credit_amount]
      properties:
        order_id:
          type: string
          format: uuid
        requester_id:
          type: string
          format: uuid
        courier_id:
          type: string
          format: uuid
          description: Required for order.completed and for order.cancelled when previous_status is PICKED_UP.
        credit_amount:
          type: integer
          minimum: 1
        previous_status:
          type: string
          description: Determines whether cancellation releases credit or compensates a courier.
        expires_at:
          type: string
          format: date-time
    CreditPayload:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: string
          format: uuid
        reason:
          type: string
          description: Includes ORDER_CANCELLED_AFTER_PICKUP when credit.transferred is compensatory.
        requester_id:
          type: string
          format: uuid
        courier_id:
          type: string
          format: uuid
        credit_amount:
          type: integer
          minimum: 1
