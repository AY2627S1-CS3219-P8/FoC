services:
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: foc_users
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d foc_users"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}@user-db:5432/foc_users
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      USER_SERVICE_INTERNAL_TOKEN: ${USER_SERVICE_INTERNAL_TOKEN:?Set USER_SERVICE_INTERNAL_TOKEN in .env}
    depends_on:
      user-db:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully
      user-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  user-migrate:
    build: ./user-service
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}@user-db:5432/foc_users
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      user-db:
        condition: service_healthy
    restart: "no"

  user-bootstrap:
    build: ./user-service
    command: ["python", "-m", "scripts.bootstrap_admin"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}@user-db:5432/foc_users
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BOOTSTRAP_ADMIN_NUS_STUDENT_NUMBER: ${BOOTSTRAP_ADMIN_NUS_STUDENT_NUMBER:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      user-db:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully
    restart: "no"

  frontend-service:
    build:
      context: ./frontend-service
    ports:
      - "3000:3000"

  supplier-service:
    image: foc-supplier-service:local
    build:
      context: ./supplier-service
    environment:
      DATABASE_URL: "postgresql+psycopg://supplier_runtime:${SUPPLIER_RUNTIME_PASSWORD:?Set runtime database password}@supplier-db:5432/${SUPPLIER_POSTGRES_DB:?Set database name}"
      USER_SERVICE_URL: http://user-service:8080
      AUTH_TIMEOUT_SECONDS: ${AUTH_TIMEOUT_SECONDS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      supplier-db:
        condition: service_healthy
      supplier-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - supplier-private
    ports:
      - "127.0.0.1:8081:8080"

  supplier-migrate:
    image: foc-supplier-service:local
    build:
      context: ./supplier-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: "postgresql+psycopg://supplier_migrator:${SUPPLIER_MIGRATION_PASSWORD:?Set migration database password}@supplier-db:5432/${SUPPLIER_POSTGRES_DB:?Set database name}"
      USER_SERVICE_URL: http://user-service:8080
      AUTH_TIMEOUT_SECONDS: ${AUTH_TIMEOUT_SECONDS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      supplier-db:
        condition: service_healthy
    networks:
      - supplier-private
    healthcheck:
      disable: true

  supplier-seed:
    profiles: [tools]
    image: foc-supplier-service:local
    build:
      context: ./supplier-service
    entrypoint: ["python", "-m", "app.commands.seed_suppliers", "--file", "/seed/supplier-seed-data.csv"]
    command: []
    restart: "no"
    environment:
      DATABASE_URL: "postgresql+psycopg://supplier_runtime:${SUPPLIER_RUNTIME_PASSWORD:?Set runtime database password}@supplier-db:5432/${SUPPLIER_POSTGRES_DB:?Set database name}"
      USER_SERVICE_URL: http://user-service:8080
      AUTH_TIMEOUT_SECONDS: ${AUTH_TIMEOUT_SECONDS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data/csv/supplier-seed-data.csv:/seed/supplier-seed-data.csv:ro
    depends_on:
      supplier-db:
        condition: service_healthy
      supplier-migrate:
        condition: service_completed_successfully
    networks:
      - supplier-private
    healthcheck:
      disable: true

  supplier-db:
    build:
      context: ./supplier-service/database
    environment:
      POSTGRES_DB: ${SUPPLIER_POSTGRES_DB:?Set database name}
      POSTGRES_USER: ${SUPPLIER_POSTGRES_USER:?Set database user}
      POSTGRES_PASSWORD: ${SUPPLIER_POSTGRES_PASSWORD:?Set database password}
    volumes:
      - supplier-db-data:/var/lib/postgresql/data
    networks:
      - supplier-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: foc_orders
      POSTGRES_USER: ${ORDER_DB_USER:?Set ORDER_DB_USER in .env}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - order-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d foc_orders"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-migrate:
    image: foc-order-service:local
    build: ./order-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${ORDER_DB_USER:?Set ORDER_DB_USER in .env}@order-db:5432/foc_orders
      PGPASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - order-private
    healthcheck:
      disable: true

  order-service:
    image: foc-order-service:local
    build: ./order-service
    container_name: order-service
    environment:
      DATABASE_URL: postgresql+psycopg://${ORDER_DB_USER:?Set ORDER_DB_USER in .env}@order-db:5432/foc_orders
      PGPASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      USER_SERVICE_URL: http://user-service:8080
      SUPPLIER_SERVICE_URL: http://supplier-service:8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      order-db:
        condition: service_healthy
      order-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - order-private
    ports:
      - "127.0.0.1:8082:8080"

  order-worker:
    image: foc-order-service:local
    build: ./order-service
    container_name: order-worker
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${ORDER_DB_USER:?Set ORDER_DB_USER in .env}@order-db:5432/foc_orders
      PGPASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
    depends_on:
      order-db:
        condition: service_healthy
      order-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - order-private
    healthcheck:
      disable: true

  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    container_name: foc-rabbitmq
    hostname: foc-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

networks:
  default: {}
  supplier-private:
    internal: true
  order-private:
    internal: true

volumes:
  supplier-db-data:
  user-db-data:
  order-db-data:
  rabbitmq-data:
