services:
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: foc_users
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d foc_users"]
      interval: 5s
      timeout: 5s
      retries: 5
  user-service:
    build: ./user-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}@user-db:5432/foc_users
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      user-db:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  user-migrate:
    build: ./user-service
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}@user-db:5432/foc_users
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      user-db:
        condition: service_healthy
    restart: "no"

  frontend-service:
    build:
      context: ./frontend-service
    ports:
      - "3000:3000"

  supplier-service:
    build:
      context: ./supplier-service
    environment:
      DATABASE_URL: "postgresql+psycopg://${SUPPLIER_POSTGRES_USER:?Set database user}:${SUPPLIER_POSTGRES_PASSWORD:?Set database password}@supplier-db:5432/${SUPPLIER_POSTGRES_DB:?Set database name}"
      USER_SERVICE_URL: http://user-service:8080
      AUTH_TIMEOUT_SECONDS: ${AUTH_TIMEOUT_SECONDS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      supplier-db:
        condition: service_healthy
    networks:
      - default
      - supplier-private
    ports:
      - "127.0.0.1:8081:8080"

  supplier-db:
    build:
      context: ./supplier-service/database
    environment:
      POSTGRES_DB: ${SUPPLIER_POSTGRES_DB:?Set database name}
      POSTGRES_USER: ${SUPPLIER_POSTGRES_USER:?Set database user}
      POSTGRES_PASSWORD: ${SUPPLIER_POSTGRES_PASSWORD:?Set database password}
    volumes:
      - supplier-db-data:/var/lib/postgresql/data
    networks:
      - supplier-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  default: {}
  supplier-private:
    internal: true

volumes:
  supplier-db-data:
  user-db-data:
