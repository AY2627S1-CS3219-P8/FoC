services:
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
