apiVersion: v1
kind: Service
metadata:
  name: demo-console
  labels:
    app: demo-console
spec:
  type: NodePort
  selector:
    app: demo-console
  ports:
    - name: http
      port: 8091
      targetPort: http
      nodePort: 30091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-console
  labels:
    app: demo-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-console
  template:
    metadata:
      labels:
        app: demo-console
    spec:
      enableServiceLinks: false
      containers:
        - name: demo-console
          image: foc-demo-console:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: USER_SERVICE_URL
              value: https://user-service:8080
            - name: USER_SERVICE_CA_FILE
              value: /run/tls/ca.crt
            - name: ORDER_SERVICE_URL
              value: http://order-service:8080
            - name: CREDIT_SERVICE_URL
              value: http://credit-service:8080
            - name: SUPPLIER_SERVICE_URL
              value: http://supplier-service:8080
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: BOOTSTRAP_ADMIN_NUS_STUDENT_NUMBER
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: BOOTSTRAP_ADMIN_NUS_STUDENT_NUMBER
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: BOOTSTRAP_ADMIN_PASSWORD
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: LOG_LEVEL
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: tls
              mountPath: /run/tls/ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: foc-tls
            items:
              - key: ca.crt
                path: ca.crt
