apiVersion: batch/v1
kind: Job
metadata:
  name: supplier-migrate
  labels:
    app: supplier-migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: supplier-migrate
        foc.io/db: supplier
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: foc-supplier-service:local
          imagePullPolicy: Never
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: SUPPLIER_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: SUPPLIER_MIGRATION_PASSWORD
            - name: SUPPLIER_POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: SUPPLIER_POSTGRES_DB
            - name: DATABASE_URL
              value: postgresql+psycopg://supplier_migrator:$(SUPPLIER_MIGRATION_PASSWORD)@supplier-db:5432/$(SUPPLIER_POSTGRES_DB)
            - name: APP_ENV
              value: development
            - name: USER_SERVICE_URL
              value: https://user-service:8080
            - name: AUTH_TIMEOUT_SECONDS
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: AUTH_TIMEOUT_SECONDS
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: LOG_LEVEL
