# One-node kind cluster. Host ports match Compose. Each host port is forwarded
# to the NodePort of the Service with the same name.
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000
        hostPort: 3000
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30081
        hostPort: 8081
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30082
        hostPort: 8082
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30083
        hostPort: 8083
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30090
        hostPort: 8090
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30091
        hostPort: 8091
        listenAddress: "127.0.0.1"
        protocol: TCP
