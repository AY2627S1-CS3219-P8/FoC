apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        foc.io/db: order
    spec:
      containers:
        - name: order-service
          image: foc-order-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ORDER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: ORDER_DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: ORDER_DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://$(ORDER_DB_USER)@order-db:5432/foc_orders
            - name: USER_SERVICE_URL
              value: https://user-service:8080
            - name: USER_SERVICE_CA_FILE
              value: /run/tls/ca.crt
            - name: SUPPLIER_SERVICE_URL
              value: http://supplier-service:8080
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: LOG_LEVEL
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: tls
              mountPath: /run/tls/ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: foc-tls
            items:
              - key: ca.crt
                path: ca.crt
