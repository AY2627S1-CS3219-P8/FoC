apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        foc.io/db: notification
    spec:
      containers:
        - name: notification-service
          image: foc-notification-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NOTIFICATION_DB_USER
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: NOTIFICATION_DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: NOTIFICATION_DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://$(NOTIFICATION_DB_USER)@notification-db:5432/foc_notifications
            - name: USER_SERVICE_URL
              value: https://user-service:8080
            - name: USER_SERVICE_CA_FILE
              value: /run/tls/ca.crt
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: foc-env
                  key: LOG_LEVEL
          readinessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: tls
              mountPath: /run/tls/ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: foc-tls
            items:
              - key: ca.crt
                path: ca.crt
