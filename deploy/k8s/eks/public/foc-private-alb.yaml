
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: foc-private-alb
spec:
  scheme: internal
  targetType: ip
  ipAddressType: ipv4
  subnets:
    ids:
      - subnet-0951f50776a126e80
      - subnet-0f048cd20bff0faeb
  inboundCIDRs:
    - "10.0.0.0/16"
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: foc-private-alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: foc-private-alb
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foc-frontend
  namespace: foc
spec:
  ingressClassName: foc-private-alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
