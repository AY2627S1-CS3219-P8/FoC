apiVersion: 1

groups:
  - orgId: 1
    name: FoC backend operational alerts
    folder: FoC Alerts
    interval: 30s
    rules:
      - uid: foc-order-worker-heartbeat
        title: Order worker heartbeat missing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: foc-loki
            model:
              datasource:
                type: loki
                uid: foc-loki
              editorMode: code
              expr: 'sum(count_over_time({source="foc-backend", service="order-worker"} | json | event="worker_heartbeat" [2m])) or on() vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Order worker heartbeat missing
          description: No order-worker worker_heartbeat event has arrived in the last two minutes.
        labels:
          source: foc-backend
          team: backend
          severity: critical

      - uid: foc-credit-worker-heartbeat
        title: Credit worker heartbeat missing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: foc-loki
            model:
              datasource:
                type: loki
                uid: foc-loki
              editorMode: code
              expr: 'sum(count_over_time({source="foc-backend", service="credit-order-worker"} | json | event="worker_heartbeat" [2m])) or on() vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Credit worker heartbeat missing
          description: No credit-order-worker worker_heartbeat event has arrived in the last two minutes.
        labels:
          source: foc-backend
          team: backend
          severity: critical

      - uid: foc-backend-delivery-failure
        title: Backend delivery failure event
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: foc-loki
            model:
              datasource:
                type: loki
                uid: foc-loki
              editorMode: code
              expr: 'sum(count_over_time({source="foc-backend"} | json | event=~".*(retry_exhausted|dead_lettered|sent_to_dlq|parked_for_dlq).*" [5m])) or on() vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Backend retry or dead-letter event detected
          description: A retry-exhausted, dead-lettered, sent-to-DLQ, or parked-for-DLQ event occurred in the last five minutes.
        labels:
          source: foc-backend
          team: backend
          severity: critical

      - uid: foc-backend-readiness-failure
