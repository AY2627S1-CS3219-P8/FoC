name: Compose CI

on:
  push:
    branches: [main]
    paths:
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/compose.yml"
  pull_request:
    paths:
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/compose.yml"

permissions:
  contents: read

jobs:
  compose-validation:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: foc_ci
      POSTGRES_PASSWORD: focCiPassword123
      USER_SERVICE_INTERNAL_TOKEN: foc_ci_internal_service_token
      SUPPLIER_POSTGRES_DB: supplier_ci
      SUPPLIER_POSTGRES_USER: supplier_ci
      SUPPLIER_POSTGRES_PASSWORD: supplierCiPassword123
      SUPPLIER_MIGRATION_PASSWORD: supplierMigrationCiPassword123
      SUPPLIER_RUNTIME_PASSWORD: supplierRuntimeCiPassword123
      ORDER_DB_USER: foc_orders
      ORDER_DB_PASSWORD: focOrdersCiPassword123
      RABBITMQ_USER: foc
      RABBITMQ_PASSWORD: focRabbitCiPassword123

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet
