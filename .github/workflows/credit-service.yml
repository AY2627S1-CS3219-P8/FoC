name: Credit Service CI

on:
  push:
    branches: [main]
    paths:
      - "credit-service/**"
      - ".github/workflows/credit-service.yml"
  pull_request:
    paths:
      - "credit-service/**"
      - ".github/workflows/credit-service.yml"

permissions:
  contents: read

jobs:
  credit-service:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: credit-service/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: credit-service

      - name: Run tests
        run: python -m pytest -q
        working-directory: credit-service

      - name: Validate migration SQL
        env:
          DATABASE_URL: postgresql+psycopg://credit@localhost/foc_credits
        run: alembic upgrade head --sql > /dev/null
        working-directory: credit-service

      - name: Build credit-service image
        run: docker build --tag foc-credit-service:ci ./credit-service
