name: Frontend Service CI

on:
  push:
    branches: [main]
    paths:
      - "frontend-service/**"
      - ".github/workflows/frontend-service.yml"
  pull_request:
    paths:
      - "frontend-service/**"
      - ".github/workflows/frontend-service.yml"

permissions:
  contents: read

jobs:
  frontend-service:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: yarn
          cache-dependency-path: frontend-service/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend-service

      - name: Lint
        run: yarn lint
        working-directory: frontend-service

      - name: Build
        run: yarn build
        working-directory: frontend-service
