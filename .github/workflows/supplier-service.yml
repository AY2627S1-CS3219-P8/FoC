name: Supplier Service CI

on:
  push:
    branches: [main]
    paths:
      - "supplier-service/**"
      - ".github/workflows/supplier-service.yml"
  pull_request:
    paths:
      - "supplier-service/**"
      - ".github/workflows/supplier-service.yml"

permissions:
  contents: read

jobs:
  supplier-service:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            supplier-service/requirements.txt
            supplier-service/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: supplier-service

      - name: Run unit and API tests
        run: python -m pytest tests/unit tests/api -q
        working-directory: supplier-service

      - name: Build supplier API image
        run: docker build --tag foc-supplier-service:ci ./supplier-service

      - name: Build supplier database image
        run: docker build --tag foc-supplier-db:ci ./supplier-service/database
