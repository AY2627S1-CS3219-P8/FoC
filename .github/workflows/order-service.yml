name: Order Service CI

on:
  push:
    branches: [main]
    paths:
      - "order-service/**"
      - ".github/workflows/order-service.yml"
  pull_request:
    paths:
      - "order-service/**"
      - ".github/workflows/order-service.yml"

permissions:
  contents: read

jobs:
  order-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foc
          POSTGRES_PASSWORD: foc_ci
          POSTGRES_DB: foc_orders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foc -d foc_orders_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://foc@localhost:5432/foc_orders_test
      PGPASSWORD: foc_ci
      USER_SERVICE_URL: http://user-service:8080
      SUPPLIER_SERVICE_URL: http://supplier-service:8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: order-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        working-directory: order-service

      - name: Check the migration matches the models
        run: |
          alembic upgrade head
          alembic check
        working-directory: order-service

      - name: Build order-service image
        run: docker build --tag foc-order-service:ci ./order-service
